include:
  - docker-compose-ode.yml
services:
  deduplicator:
    profiles:
      - all
      - deduplicator_base
      - deduplicator_full
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_GITHUB_TOKEN: ${MAVEN_GITHUB_TOKEN}
        MAVEN_GITHUB_ORG: ${MAVEN_GITHUB_ORG}
    image: jpo-deduplicator:latest
    privileged: false # Set true to allow writing to /proc/sys/vm/drop_caches
    restart: ${RESTART_POLICY}
    ports:
      - "10091:10090" # JMX
    environment:
      DOCKER_HOST_IP: ${DOCKER_HOST_IP}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_KAFKA_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ENABLE_PROCESSED_MAP_DEDUPLICATION: ${ENABLE_PROCESSED_MAP_DEDUPLICATION}
      ENABLE_PROCESSED_MAP_WKT_DEDUPLICATION: ${ENABLE_PROCESSED_MAP_WKT_DEDUPLICATION}
      ENABLE_ODE_MAP_DEDUPLICATION: ${ENABLE_ODE_MAP_DEDUPLICATION}
      ENABLE_ODE_TIM_DEDUPLICATION: ${ENABLE_ODE_TIM_DEDUPLICATION}
      ENABLE_PROCESSED_SPAT_DEDUPLICATION: ${ENABLE_PROCESSED_SPAT_DEDUPLICATION}
      ENABLE_ODE_BSM_DEDUPLICATION: ${ENABLE_ODE_BSM_DEDUPLICATION}
      ENABLE_PROCESSED_BSM_DEDUPLICATION: ${ENABLE_PROCESSED_BSM_DEDUPLICATION}

      ODE_MAP_MAXIMUM_TIME_DELTA_MINUTES: ${ODE_MAP_MAXIMUM_TIME_DELTA_MINUTES}
      ODE_TIM_MAXIMUM_TIME_DELTA_MINUTES: ${ODE_TIM_MAXIMUM_TIME_DELTA_MINUTES}
      PROCESSED_MAP_MAXIMUM_TIME_DELTA_MINUTES: ${PROCESSED_MAP_MAXIMUM_TIME_DELTA_MINUTES}
      PROCESSED_MAP_WKT_MAXIMUM_TIME_DELTA_MINUTES: ${PROCESSED_MAP_WKT_MAXIMUM_TIME_DELTA_MINUTES}
      PROCESSED_SPAT_MAXIMUM_TIME_DELTA_SECONDS: ${PROCESSED_SPAT_MAXIMUM_TIME_DELTA_SECONDS}
      ODE_BSM_MAXIMUM_TIME_DELTA_MS: ${ODE_BSM_MAXIMUM_TIME_DELTA_MS}
      ODE_BSM_MAXIMUM_POSITION_DELTA: ${ODE_BSM_MAXIMUM_POSITION_DELTA}
      ODE_BSM_ALWAYS_INCLUDE_AT_SPEED: ${ODE_BSM_ALWAYS_INCLUDE_AT_SPEED}
      PROCESSED_BSM_MAXIMUM_TIME_DELTA_MS: ${PROCESSED_BSM_MAXIMUM_TIME_DELTA_MS}
      PROCESSED_BSM_MAXIMUM_POSITION_DELTA: ${PROCESSED_BSM_MAXIMUM_POSITION_DELTA}
      PROCESSED_BSM_ALWAYS_INCLUDE_AT_SPEED: ${PROCESSED_BSM_ALWAYS_INCLUDE_AT_SPEED}

      DEDUPLICATOR_ROCKSDB_TOTAL_OFF_HEAP_MEMORY: ${DEDUPLICATOR_ROCKSDB_TOTAL_OFF_HEAP_MEMORY}
      DEDUPLICATOR_ROCKSDB_INDEX_FILTER_BLOCK_RATIO: ${DEDUPLICATOR_ROCKSDB_INDEX_FILTER_BLOCK_RATIO}
      DEDUPLICATOR_ROCKSDB_TOTAL_MEMTABLE_MEMORY: ${DEDUPLICATOR_ROCKSDB_TOTAL_MEMTABLE_MEMORY}
      DEDUPLICATOR_ROCKSDB_BLOCK_SIZE: ${DEDUPLICATOR_ROCKSDB_BLOCK_SIZE}
      DEDUPLICATOR_ROCKSDB_N_MEMTABLES: ${DEDUPLICATOR_ROCKSDB_N_MEMTABLES}
      DEDUPLICATOR_ROCKSDB_MEMTABLE_SIZE: ${DEDUPLICATOR_ROCKSDB_MEMTABLE_SIZE}

      KAFKA_TYPE: ${KAFKA_TYPE}
      CONFLUENT_KEY: ${CONFLUENT_KEY}
      CONFLUENT_SECRET: ${CONFLUENT_SECRET}
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 10s
      timeout: 10s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      kafka:
        condition: service_healthy
        required: false
